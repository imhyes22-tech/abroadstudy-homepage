<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국제학교 안내 | 준비중</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#f7f8fb; --fg:#1d2433; --muted:#5d6678; --accent:#1f5fbf; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151c; --fg:#e8ebf2; --muted:#a3abbb; --accent:#7fb0ff; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; padding:16px; text-align:center; }
  h1 { font-size:clamp(1.6rem,5vw,2.4rem); margin:0 0 12px; }
  p { color:var(--muted); line-height:1.7; margin:0; }
  .dot { color:var(--accent); }
</style>
</head>
<body>
  <main>
    <h1>국제학교 안내 홈페이지<span class="dot">.</span></h1>
    <p>현재 홈페이지를 준비하고 있습니다.<br>곧 찾아뵙겠습니다.</p>
  </main>
</body>
</html>
